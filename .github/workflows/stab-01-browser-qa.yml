name: STAB-01 Browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.cjs"
      - ".github/workflows/stab-01-browser-qa.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - qa/stab-01-rail-navigation

permissions:
  contents: read

jobs:
  browser-qa:
    name: Browser QA (rail flag ${{ matrix.rail_flag }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rail_flag: ["0", "1"]
    env:
      RAIL_FLAG: ${{ matrix.rail_flag }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser QA matrix
        run: npx playwright test

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stab-01-playwright-rail-${{ matrix.rail_flag }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
